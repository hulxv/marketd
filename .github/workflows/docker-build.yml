name: Docker Build Test

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "src/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "src/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  docker-build:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: marketd:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container
        run: |
          set -euo pipefail

          # marketd's HTTP server binds before sync_loop establishes the
          # bitcoind connection, so /api/health responds even without a
          # backing node. That makes a hermetic smoke test possible —
          # the daemon will retry-spam connection errors to bitcoind in
          # the background, which is expected.
          docker run -d --rm --name marketd-test -p 3000:3000 marketd:test

          cleanup() { docker stop marketd-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # Wait up to 30 s for the HTTP server to bind.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "marketd is responding"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "marketd did not respond within 30 s"
              docker logs marketd-test || true
              exit 1
            fi
            sleep 1
          done

          # /api/health: status=ok, maker_count=0 on a fresh container.
          health=$(curl -fsS http://127.0.0.1:3000/api/health)
          echo "Health: $health"
          if ! echo "$health" | jq -e '.status == "ok" and .maker_count == 0 and .with_offer == 0' > /dev/null; then
            echo "Health assertion failed"
            docker logs marketd-test || true
            exit 1
          fi

          # /api/makers: empty array on a fresh container.
          makers=$(curl -fsS http://127.0.0.1:3000/api/makers)
          echo "Makers: $makers"
          if ! echo "$makers" | jq -e 'type == "array" and length == 0' > /dev/null; then
            echo "Makers assertion failed"
            docker logs marketd-test || true
            exit 1
          fi

          # SPA fallback serves the frontend (index.html from web/dist).
          if ! curl -fsS http://127.0.0.1:3000/ > /dev/null; then
            echo "SPA root path did not respond"
            docker logs marketd-test || true
            exit 1
          fi
